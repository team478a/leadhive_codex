name: LeadHive checks
on: [push, pull_request]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m ruff format --check backend
          backend/.venv/bin/python -c "from app.main import app; print(app.title)"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: backend/.venv/bin/python -m pytest backend/tests -q

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: |
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/python -m alembic -c backend/alembic.ini downgrade base
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/python -m alembic -c backend/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
