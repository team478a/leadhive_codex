name: LeadHive checks
on: [push, pull_request]

jobs:
  pc-input-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium
      - name: Package and test without host runtimes on PATH
        run: |
          python scripts/pc_connector/package_runner.py
          python scripts/pc_connector/verify_package.py
      - uses: actions/upload-artifact@v6
        with:
          name: pc-input-runner-windows-x64
          path: |
            dist/pc-input-*.zip
            dist/pc-input-*.zip.sha256
          retention-days: 14

  pc-review-connector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 ruff==0.11.13 mypy==2.4.0
      - run: |
          python -m pytest scripts/pc_connector -q
          python -m ruff check scripts/pc_connector
          python -m ruff format --check scripts/pc_connector
          python -m mypy --check-untyped-defs scripts/pc_connector/client.py

  offline-collection-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 mypy==2.4.0
      - run: |
          python -m pytest offline_tests -q
          python -m mypy offline_replay --check-untyped-defs
        working-directory: backend

  backend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
          backend/.venv/bin/python -m pip install mypy==2.4.0
      - run: |
          backend/.venv/bin/python -m ruff check backend
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/pc_input_routes.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/collection_feedback_routes.py backend/app/services/collection_feedback.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/controlled_confirmation_contract.py backend/app/services/controlled_confirmation_review.py backend/app/services/two_stage_lab_contract.py
          backend/.venv/bin/python -m ruff format --check backend
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/cf7_616_contract.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/cf7_large_page_review.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/benchmark_evidence.py backend/app/services/benchmark_summary.py backend/app/services/cohort_destinations.py backend/app/services/completion_metrics.py backend/app/completion_metrics_routes.py backend/scripts/run_completion_benchmark.py backend/app/site_identity_review_routes.py backend/app/lead_completion_routes.py backend/app/raw_collection_routes.py backend/app/model_raw_collection.py backend/app/project_access.py backend/app/services/raw_capture.py backend/app/services/raw_benchmark.py backend/app/services/raw_repeat.py backend/app/raw_pair_routes.py
          backend/.venv/bin/python -c "from app.main import app; print(app.title)"
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/site_extraction.py backend/app/services/contact_discovery.py backend/app/services/website_evidence.py backend/app/services/scraper.py backend/app/services/lead_identity.py backend/app/services/web_analysis.py backend/app/services/form_intelligence/analyzer.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/model_external_presence.py backend/app/schema_external_presence.py backend/app/services/external_presence.py backend/app/services/presence_platforms.py backend/app/external_presence_routes.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/model_collection_conditions.py backend/app/schema_collection_conditions.py backend/app/services/collection_conditions.py backend/app/collection_condition_routes.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/condition_collection.py backend/app/schema_workflow.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/collection_fact_reviews.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/condition_proposal.py backend/app/services/condition_sentence.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/region_condition.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/official_site_condition.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/industry_review_hints.py backend/app/services/industry_role_hints.py backend/app/services/industry_aliases.py backend/app/schema_core.py backend/app/services/ai_analysis.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/condition_summary.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/sending_window.py backend/app/sending_window_routes.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/target_collection.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/model_collection_discovery.py backend/app/services/discovery_capture.py backend/app/services/collection_discovery.py backend/app/services/collection_runtime.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/model_collection_scheduler.py backend/app/services/collection_query_plan.py backend/app/services/collection_search_policy.py backend/app/services/collection_scheduler.py backend/app/services/collection.py backend/app/services/collection_jobs.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/form_intelligence/fields.py backend/app/services/form_profile_delivery.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/form_review_material.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/form_intelligence_routes.py backend/app/schema_form_review.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/form_choice_groups.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/form_live_check.py backend/app/services/cf7_static_inspection.py backend/app/services/cf7_static_parser.py backend/app/services/form_pinned_get.py backend/app/services/pinned_read_transport.py backend/app/services/pinned_dns.py backend/app/services/pinned_dns_worker.py
          MYPYPATH=backend backend/.venv/bin/python -m mypy --check-untyped-defs --follow-imports=silent backend/app/services/form_target_refresh.py backend/app/services/form_route_diagnostics.py backend/app/services/form_observation_projection.py backend/app/services/form_observation_safety.py backend/app/services/contact_permission.py

  backend-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Docker Official Image mirror avoids Docker Hub shared-runner pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: backend/.venv/bin/python -m pytest backend/tests -q

  form-http-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Docker Official Image mirror avoids Docker Hub shared-runner pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_form_http_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_form_http_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_form_http_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_form_http_test
      FORM_HTTP_LAB: '1'
      OUTBOUND_ENABLED: 'false'
      HUMAN_APPROVED_FORM_ENABLED: 'false'
      LEGACY_FORM_DELIVERY_ENABLED: 'false'
      AGENT_FEATURES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: .venv/bin/python -m pytest tests/test_form_http_acceptance.py -q
        working-directory: backend

  migration-validation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Docker Official Image mirror avoids Docker Hub shared-runner pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
      - run: |
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/python -m alembic -c backend/alembic.ini downgrade base
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/python -m alembic -c backend/alembic.ini check
          backend/.venv/bin/python backend/scripts/verify_database_state.py

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Docker Official Image mirror avoids Docker Hub shared-runner pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: leadhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/leadhive_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
          backend/.venv/bin/python -m pip install --no-deps -e backend
          backend/.venv/bin/python -m alembic -c backend/alembic.ini upgrade head
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  form-browser-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:form-browser-poc
          node form-lab/summarize.mjs test-results/form-browser-poc/report.json test-results/form-browser-poc/summary.json
          npx playwright test --config form-lab/handoff-ui.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: localhost-form-browser-poc
          path: frontend/test-results/form-browser-poc

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify instance isolation without Docker or external services
        shell: powershell
        run: .\scripts\tests\instance-identity.tests.ps1
      - name: Build and verify the Windows distribution package
        shell: powershell
        run: .\scripts\package-windows.ps1

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python -m pip install -r backend/requirements.lock
          backend/.venv/Scripts/python -m pip install --no-deps -e backend
          backend/.venv/Scripts/python -m pip install -r scripts/native/build-requirements.txt
      - working-directory: frontend
        run: npm ci
      - run: |
          backend/.venv/Scripts/python -m ruff check scripts/native scripts/package-windows-native.py
          backend/.venv/Scripts/python -m ruff format --check scripts/native scripts/package-windows-native.py
          backend/.venv/Scripts/python -m unittest discover -s scripts/native -p test_native_runtime.py
          backend/.venv/Scripts/python scripts/package-windows-native.py
          backend/.venv/Scripts/python scripts/native/verify_package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LeadHive-Windows-Native-Prototype
          path: |
            dist/LeadHive-Windows-Native-*.zip
            dist/LeadHive-Windows-Native-*.zip.sha256
            dist/native-acceptance-result.json
