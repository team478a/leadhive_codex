<form method="post">
  <table>
    <tr><th>姓</th><td><input name="sei" required></td></tr>
    <tr><th>名</th><td><input name="mei" required></td></tr>
    <tr><th>セイ</th><td><input name="last_name_kana" required></td></tr>
    <tr><th>メイ</th><td><input name="first_name_kana" required></td></tr>
    <tr><th>会社名</th><td><input name="company" required></td></tr>
    <tr><th>部署・役職</th><td><input name="department" required><input name="position" required></td></tr>
    <tr><th>郵便番号</th><td><input name="postal_1" maxlength="3" required> - <input name="postal_2" maxlength="4" required></td></tr>
    <tr><th>都道府県</th><td><select name="prefecture"><option>東京都</option></select></td></tr>
    <tr><th>市区町村</th><td><input name="city" required></td></tr>
    <tr><th>番地</th><td><input name="street" required></td></tr>
    <tr><th>建物名</th><td><input name="building" required></td></tr>
    <tr><th>電話番号</th><td><input type="tel" name="tel1" maxlength="3" required> - <input type="tel" name="tel2" maxlength="4" required> - <input type="tel" name="tel3" maxlength="4" required></td></tr>
  </table>
</form>
