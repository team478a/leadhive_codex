<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>合成問い合わせフォーム</title></head>
<body>
  <main>
    <h1>お問い合わせ</h1>
    <form class="wpcf7-form" method="post" action="/contact">
      <input type="hidden" name="_wpcf7" value="fixture-marker">
      <label>会社名<input name="your-company" required value="not persisted"></label>
      <label>メール<input type="email" name="your-email" required></label>
      <label>お問い合わせ内容<textarea name="your-message" required>not persisted</textarea></label>
      <div class="g-recaptcha"></div>
      <input type="submit" value="送信">
    </form>
    <form method="post" enctype="multipart/form-data" action="/files">
      <label>お問い合わせ内容<textarea name="message"></textarea></label>
      <input type="file" name="attachment">
      <button type="submit">送信</button>
    </form>
    <form method="post" action="/confirm">
      <label>お問い合わせ内容<textarea name="message"></textarea></label>
      <button type="button" onclick="return false">確認画面へ</button>
    </form>
    <form method="post" action="/async" onsubmit="return false">
      <label>お問い合わせ内容<textarea name="message"></textarea></label>
      <button type="submit">送信</button>
    </form>
  </main>
</body>
</html>
